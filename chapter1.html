<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บทที่ 1 : แนะนำการเขียนโปรแกรมเชิงวัตถุ</title>
  <link rel="icon" href="images\SchoolLogo" type="image/png">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(120deg, #d2e1ff, #f8f9ff, #ffe6f0);
      background-size: 200% 200%;
      animation: moveBg 10s infinite alternate;
    }

    @keyframes moveBg {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .glass {
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 30px;
      margin: 40px auto;
      width: 85%;
      max-width: 1000px;
      box-shadow: 0 8px 32px rgba(31,38,135,0.1);
    }

    h1 {
      text-align: center;
      color: #0071e3;
    }

    .pdf-container {
      margin: 25px auto;
      width: 100%;
      height: 700px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
    }

    a.button {
      text-decoration: none;
      background: #0071e3;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      transition: 0.3s;
      font-weight: 500;
    }

    a.button:hover {
      background: #005bb5;
    }

    footer {
      text-align: center;
      color: #666;
      font-size: 0.9em;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <div class="glass">
    <h1>บทที่ 1 : แนะนำการเขียนโปรแกรมเชิงวัตถุ</h1>

    <!-- 📄 แสดงไฟล์ PDF แนะนำบท -->
    <div class="pdf-container">
      <iframe src="Project1.pdf"></iframe>
    </div>

    <!-- 🔘 ปุ่มนำทาง -->
    <div class="nav-buttons">
      <a href="index.html" class="button">🏠 กลับหน้าหลัก</a>
      <a href="chapter1-content.html" class="button">📘 เข้าสู่เนื้อหาบทนี้</a>
    </div>
  </div>

  <footer>
    <p>© 2025 จัดทำโดย นางสาว ศรนรี บุญประกอบ</p>
  </footer>

</body>
</html>
