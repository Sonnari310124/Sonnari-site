<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บทที่ 1 : บทบาทของโปรแกรมเชิงวัตถุเบื้องต้น</title>
  <link rel="icon" href="images\SchoolLogo.png" type="image/png">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(120deg, #d2e1ff, #f8f9ff, #ffe6f0);
      background-size: 200% 200%;
      animation: moveBg 12s infinite alternate;
      overflow-x: hidden;
    }

    @keyframes moveBg {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    /* ------------------- INTRO TEXT + LOGO ------------------- */
    .intro-text {
      position: fixed;
      top: 40%;
      width: 100%;
      text-align: center;
      font-size: 3em;
      font-weight: bold;
      color: #000000;
      opacity: 0;
      text-shadow: 0 0 15px rgba(0,0,0,0.3), 0 0 30px rgba(0,0,0,0.2);
      animation: introFade 4s ease forwards;
      z-index: 100;
    }

    .intro-logo {
      display: block;
      margin: 20px auto 0;
      width: 80px;
      height: auto;
    }

    @keyframes introFade {
      0% { opacity: 0; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0; transform: scale(1.2); }
    }

    /* ------------------- CONTENT FADE IN ------------------- */
    .content {
      opacity: 0;
      animation: contentFade 2s ease forwards;
      animation-delay: 4s;
      width: 85%;
      max-width: 1000px;
      margin: 120px auto 50px;
    }

    @keyframes contentFade {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ------------------- GLASS CONTAINER ------------------- */
    .glass {
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(31,38,135,0.1);
      position: relative;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      color: #000000;
      margin-bottom: 30px;
    }

    /* ------------------- PDF CONTAINER ------------------- */
    .pdf-wrapper {
      position: relative;
      width: 100%;
      height: 700px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    .pdf-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .pdf-wrapper:hover iframe {
      transform: scale(1.03);
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }

    /* ------------------- COLLEGE LOGO ON PDF ------------------- */
    .pdf-logo {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 60px;
      height: 60px;
      cursor: pointer;
    }

    .pdf-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.3s, box-shadow 0.3s;
      box-shadow: 0 0 15px rgba(0,0,0,0.3), 0 0 30px rgba(0,0,0,0.2);
      border-radius: 8px;
    }

    .pdf-logo:hover img {
      transform: scale(1.2);
      box-shadow: 0 0 25px rgba(0,0,0,0.5), 0 0 40px rgba(0,0,0,0.4);
    }

    /* ------------------- NAV BUTTON ------------------- */
    .nav-buttons {
      display: flex;
      justify-content: space-between; /* ปุ่มซ้าย-ขวา */
      margin-top: 25px;
    }

    a.button {
      text-decoration: none;
      background: #0071e3;
      color: white;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 500;
      transition: 0.3s;
    }

    a.button:hover {
      background: #005bb5;
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
    }

    footer {
      text-align: center;
      color: #666;
      font-size: 0.9em;
      margin: 50px auto 30px;

    }

  </style>
</head>
<body>

  <!-- ------------------- INTRO TEXT + LOGO ------------------- -->
  <div class="intro-text">
    บทที่ 1 : บทบาทของโปรแกรมเชิงวัตถุเบื้องต้น
    <img src="images\SchoolLogo.png" alt="Logo" class="intro-logo">
  </div>

  <!-- ------------------- MAIN CONTENT ------------------- -->
  <div class="content">
    <div class="glass">
      <h1>บทที่ 1 : บทบาทของโปรแกรมเชิงวัตถุเบื้องต้น</h1>

      <!-- PDF VIEWER -->
      <div class="pdf-wrapper">
        <iframe src="images/Project1.pdf"></iframe>
        <div class="pdf-logo">
          <img src="images\SchoolLogo.png" alt="Logo">
        </div>
      </div>

      <!-- NAV BUTTONS -->
      <div class="nav-buttons">
        <a href="index.html" class="button">🏠 กลับหน้าหลัก</a>
        <a href="chapter1-content.html" class="button">📘 เข้าสู่เนื้อหาต่อไป</a>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2025 จัดทำโดย นางสาว ศรนรี บุญประกอบ</p>
  </footer>

</body>
</html>
